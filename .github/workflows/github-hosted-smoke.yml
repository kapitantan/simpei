name: GitHub-hosted runner smoke test 

on:
  push:
    branches:
      - main
      - feature/online_multiplayer

permissions: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm runner
        run: echo "GitHub Actions hosted runner is working."

      - name: finished
        run: |
          echo "Smoke test completed successfully."
          ls -la

