name: GitHub-hosted runner CI and build

on:
  push:
    branches:
      - main
      - feature/online_multiplayer

permissions:
  contents: read
  id-token: write

jobs:
  ci-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            aws-app/web/package-lock.json
            aws-app/infra/package-lock.json

      - name: Install web dependencies
        working-directory: aws-app/web
        run: npm ci

      - name: Lint web
        working-directory: aws-app/web
        run: npm run lint

      - name: Build web
        working-directory: aws-app/web
        run: npm run build

      - name: Install infrastructure dependencies
        working-directory: aws-app/infra
        run: npm ci

      - name: Lint infrastructure
        working-directory: aws-app/infra
        run: npm run lint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::886121092053:role/SimpeiGitHubActionsRole
          aws-region: ap-northeast-1
          allowed-account-ids: "886121092053"

      - name: Verify AWS identity
        if: github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity
      
      - name: Synthesize CloudFormation template
        working-directory: aws-app/infra
        run: npm run synth

      - name: finished
        run: |
          echo "Smoke test completed successfully."
