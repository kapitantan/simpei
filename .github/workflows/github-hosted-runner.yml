name: GitHub-hosted runner CI and build

on:
  push:

permissions:
  contents: read

jobs:
  ci-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            aws-app/web/package-lock.json
            aws-app/infra/package-lock.json

      - name: Install web dependencies
        working-directory: aws-app/web
        run: npm ci

      - name: Lint web
        working-directory: aws-app/web
        run: npm run lint

      - name: Build web
        working-directory: aws-app/web
        run: npm run build

      - name: Install infrastructure dependencies
        working-directory: aws-app/infra
        run: npm ci

      - name: Lint infrastructure
        working-directory: aws-app/infra
        run: npm run lint

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: aws-app/web/dist          # artifact領域に保存してjob間で成果物を渡す
          if-no-files-found: error        # distがないと失敗
          retention-days: 1               # 1日後に削除

  aws-deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci-and-build                  # ci-and-buildに依存
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aws-app/infra/package-lock.json

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: aws-app/web/dist

      - name: Install infrastructure dependencies
        working-directory: aws-app/infra
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::886121092053:role/SimpeiGitHubActionsRole
          aws-region: ap-northeast-1
          allowed-account-ids: "886121092053"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Synthesize CloudFormation template
        working-directory: aws-app/infra
        run: npm run synth

      - name: Deploy static site
        working-directory: aws-app/infra
        run: npm run deploy -- --require-approval never
